name: Temporary main raw-distribution conversion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load and run the isolated conversion
        shell: bash
        run: |
          git fetch origin agent/use-raw-main-distribution
          git show FETCH_HEAD:.github/tmp_convert_raw.py > /tmp/ams-convert-raw.py
          python /tmp/ams-convert-raw.py
          bash -n install.sh

          expected='f35aa28cad7c2691e80823e36ca276cbee8b20de067600fd8edb8f2aaf10fe4b'
          actual="$(sha256sum adaptive-master-subagent-orchestration-3.09.zip | awk '{print $1}')"
          test "$actual" = "$expected"

          grep -Fq 'raw/refs/heads/$RepositoryBranch/$AssetName' install.ps1
          grep -Fq 'raw/refs/heads/${repo_branch}/${asset_name}' install.sh

          if grep -R -n -E 'releases/download|virtual-hierarchy-final-audited|ReleaseZip' README.md INSTALLATION.md 'PRODUCT DOCUMENTATION.md' install.ps1 install.sh; then
            echo "A stale release distribution reference remains." >&2
            exit 1
          fi

          if grep -n -E 'GITHUB_TOKEN|Get-DownloadTarget|ReleaseTag|release_tag=' install.ps1 install.sh; then
            echo "Release-specific installer logic remains." >&2
            exit 1
          fi

      - name: Commit raw-main distribution changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md INSTALLATION.md 'PRODUCT DOCUMENTATION.md' install.ps1 install.sh
          git commit -m "Use repository raw files for AMS installation"
          git push origin HEAD:main
