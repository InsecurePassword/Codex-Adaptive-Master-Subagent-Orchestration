name: Release audit

on:
  pull_request:
    branches:
      - main
      - post-merge-release-audit
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      audit_scope:
        description: Audit platform
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux

concurrency:
  group: release-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-audit:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      inputs.audit_scope == 'all' ||
      inputs.audit_scope == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact audited revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record Windows environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          & pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion'
          python --version
          git --version
          git status --short
          git rev-parse HEAD

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -LiteralPath $PWD -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Error ($_.FullName + ": " + (($errors | ForEach-Object Message) -join "; "))
            }
          }
          if ($failed) { exit 1 }

      - name: Parse PowerShell with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -LiteralPath $PWD -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Error ($_.FullName + ": " + (($errors | ForEach-Object Message) -join "; "))
            }
          }
          if ($failed) { exit 1 }

      - name: Run required Windows audit commands
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B -E -s -S .\scripts\refresh_manifests.py --check
          python -B -E -s -S .\scripts\audit_markdown.py
          python -B -E -s -S .\scripts\audit_installers.py
          python -B -E -s -S .\tests\test_windows_installers.py
          python -B -E -s -S .\adaptive-master-subagent-orchestration-option-a-two-skill\scripts\validate_package.py
          python -B -E -s -S .\adaptive-master-subagent-orchestration-option-b-unified\scripts\validate_package.py
          python -B -E -s -S .\adaptive-master-subagent-orchestration-option-c-installer-required\scripts\validate_package.py

      - name: Verify clean audited checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --exit-code
          $status = git status --porcelain
          if ($status) {
            Write-Error "Audit left repository changes:`n$status"
            exit 1
          }

  linux-audit:
    if: >-
      github.event_name == 'push' ||
      inputs.audit_scope == 'all' ||
      inputs.audit_scope == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact audited revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete installer and Markdown audit
        shell: bash
        run: |
          set -euo pipefail
          python -B -E -s -S scripts/audit_installers.py
