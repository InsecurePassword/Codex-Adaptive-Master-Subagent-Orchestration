name: Release audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply lock fixes and regenerate manifests
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/apply_cross_platform_lock_fix.py ]]; then
            python -B -E -s -S scripts/apply_cross_platform_lock_fix.py
            rm scripts/apply_cross_platform_lock_fix.py
          fi
          python -B -E -s -S scripts/refresh_manifests.py
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -B -E -s -S scripts/audit_installers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize cross-platform lock diagnostics [skip ci]"
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

  audit:
    needs: prepare
    if: needs.prepare.outputs.changed == 'false'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete installer and Markdown audit
        id: release_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="release-audit-${RUNNER_OS}.log"
          python -B -E -s -S scripts/audit_installers.py > "$log" 2>&1
          status=$?
          cat "$log"
          exit $status

      - name: Upload audit failure
        if: steps.release_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ runner.os }}-failure
          path: release-audit-${{ runner.os }}.log

      - name: Stop after audit failure
        if: steps.release_audit.outcome == 'failure'
        run: exit 1
