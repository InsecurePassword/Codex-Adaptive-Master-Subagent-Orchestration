name: Release audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete installer and Markdown audit
        id: release_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="release-audit-${RUNNER_OS}.log"
          python -B -E -s -S scripts/audit_installers.py > "$log" 2>&1
          status=$?
          cat "$log"
          exit $status

      - name: Upload audit failure
        if: steps.release_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ runner.os }}-failure
          path: release-audit-${{ runner.os }}.log

      - name: Stop after audit failure
        if: steps.release_audit.outcome == 'failure'
        run: exit 1

  export-audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v4

      - name: Create source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path.cwd()
          output = root / "independent-audit-source.zip"
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*"), key=lambda item: item.as_posix()):
                  if not path.is_file() or ".git" in path.parts or path == output:
                      continue
                  archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: independent-audit-source-${{ github.sha }}
          path: independent-audit-source.zip
          if-no-files-found: error
