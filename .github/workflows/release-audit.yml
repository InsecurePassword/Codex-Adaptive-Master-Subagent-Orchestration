# Native Windows PowerShell release audit v4.0.1
name: Release audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-powershell-audit:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AMS_TEST_ROOT: ${{ runner.temp }}\ams-test
      AMS_TEST_HOME: ${{ runner.temp }}\ams-test\home
      CODEX_HOME: ${{ runner.temp }}\ams-test\codex
    steps:
      - name: Check out exact audited revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record Windows PowerShell environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          git --version
          git rev-parse HEAD

      - name: Parse the deployment script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "deploy.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify single-package repository shape
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path .\deploy.ps1 -PathType Leaf)) { throw "deploy.ps1 is missing" }
          if (Test-Path .\install.ps1) { throw "legacy install.ps1 remains" }
          if (Test-Path .\install.sh) { throw "legacy install.sh remains" }
          if (Test-Path .\adaptive-master-subagent-orchestration-option-a-two-skill) { throw "Option A remains" }
          if (Test-Path .\adaptive-master-subagent-orchestration-option-b-unified) { throw "Option B remains" }
          if (-not (Test-Path .\adaptive-master-subagent-orchestration-option-c-installer-required -PathType Container)) { throw "lean payload is missing" }
          if (Get-ChildItem -Recurse -File -Include *.py,*.sh) { throw "Python or Bash deployment files remain" }
          $policy = Get-Content .\adaptive-master-subagent-orchestration-option-c-installer-required\skills\ams-orchestration\agents\openai.yaml -Raw
          if ($policy -notmatch 'allow_implicit_invocation:\s*true') { throw "implicit invocation is not enabled" }
          if ($policy -match 'allow_implicit_invocation:\s*false') { throw "explicit-only policy remains" }
          $skill = Get-Content .\adaptive-master-subagent-orchestration-option-c-installer-required\skills\ams-orchestration\SKILL.md -Raw
          if ($skill -notmatch 'intensity = "auto"') { throw "auto is not the default intensity" }
          if ((Get-ChildItem .\adaptive-master-subagent-orchestration-option-c-installer-required\assets\agent-profiles\ams_*.toml -File).Count -ne 18) { throw "expected 18 profiles" }

      - name: Test install
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path @($env:AMS_TEST_HOME, $env:CODEX_HOME) -Force | Out-Null
          & .\deploy.ps1 -Action Install -SourceDirectory $PWD -HomeDirectory $env:AMS_TEST_HOME -ExcludeSpark
          $skill = Join-Path $env:AMS_TEST_HOME ".agents\skills\ams-orchestration"
          $agents = Join-Path $env:CODEX_HOME "agents"
          $intensity = Join-Path $env:CODEX_HOME "ams-orchestration.toml"
          if (-not (Test-Path $skill -PathType Container)) { throw "skill was not installed" }
          if ((Get-ChildItem $agents\ams_*.toml -File).Count -ne 15) { throw "non-Spark install did not create 15 profiles" }
          if ((Get-Content $intensity -Raw) -notmatch 'intensity = "auto"') { throw "auto intensity was not installed" }
          if ((Get-Content (Join-Path $skill "agents\openai.yaml") -Raw) -notmatch 'allow_implicit_invocation:\s*true') { throw "installed skill is not implicit" }
          if ((Get-Content (Join-Path $env:CODEX_HOME "config.toml") -Raw) -notmatch 'max_depth\s*=\s*1') { throw "max_depth was not enforced" }

      - name: Test repair
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $damaged = Join-Path $env:CODEX_HOME "agents\ams_terra_medium.toml"
          Set-Content -LiteralPath $damaged -Value "# managed-by: adaptive-master-subagent-orchestration`nbroken = true" -Encoding UTF8
          & .\deploy.ps1 -Action Repair -SourceDirectory $PWD -HomeDirectory $env:AMS_TEST_HOME -ExcludeSpark
          if ((Get-Content $damaged -Raw) -notmatch 'name = "ams_terra_medium"') { throw "repair did not restore the damaged profile" }

      - name: Test uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\deploy.ps1 -Action Uninstall -HomeDirectory $env:AMS_TEST_HOME -Force
          $skill = Join-Path $env:AMS_TEST_HOME ".agents\skills\ams-orchestration"
          $agents = Join-Path $env:CODEX_HOME "agents"
          $intensity = Join-Path $env:CODEX_HOME "ams-orchestration.toml"
          if (Test-Path $skill) { throw "skill remains after uninstall" }
          if (Test-Path $intensity) { throw "managed intensity remains after uninstall" }
          if (Test-Path $agents -PathType Container) {
            if (Get-ChildItem $agents\ams_*.toml -File -ErrorAction SilentlyContinue) { throw "managed profiles remain after uninstall" }
          }

      - name: Clean isolated lifecycle paths
        if: always()
        shell: powershell
        run: |
          if ($env:AMS_TEST_ROOT) { Remove-Item -LiteralPath $env:AMS_TEST_ROOT -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Verify clean audited checkout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git diff --exit-code
          $status = git status --porcelain
          if ($status) { throw "Audit left repository changes:`n$status" }
