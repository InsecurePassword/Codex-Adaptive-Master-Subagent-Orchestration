name: Temporary finalize AMS persistence fix

on:
  push:
    branches:
      - "agent/fix-ams-persistence-bootstrap"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild package and synchronize documentation
        shell: bash
        run: |
          python .github/ams-fix/finalize.py | tee /tmp/ams-finalize.txt
          bash -n install.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))'
          grep '^PACKAGE_' /tmp/ams-finalize.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary scaffolding and commit
        shell: bash
        run: |
          rm -rf -- .github/ams-fix
          rm -- .github/workflows/temporary-finalize-ams-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize AMS persistence bootstrap"
          git push origin HEAD:"${GITHUB_REF_NAME}"
