name: Temporary finalize AMS persistence fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-ams-persistence-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ams-persistence-bootstrap
          fetch-depth: 0

      - name: Rebuild package and synchronize documentation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python .github/ams-fix/finalize.py > /tmp/ams-finalize.txt 2>&1
          status=$?
          set -e
          cat /tmp/ams-finalize.txt
          if [ "$status" -ne 0 ]; then
            {
              echo 'AMS finalizer failed:'
              echo
              echo '```text'
              tail -80 /tmp/ams-finalize.txt
              echo '```'
            } > /tmp/ams-finalize-comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/ams-finalize-comment.md
            exit "$status"
          fi
          bash -n install.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))'
          grep '^PACKAGE_' /tmp/ams-finalize.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary scaffolding and commit
        shell: bash
        run: |
          rm -rf -- .github/ams-fix
          rm -- .github/ams-persistence-finalize-trigger
          rm -- .github/workflows/temporary-finalize-ams-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize AMS persistence bootstrap"
          git push origin HEAD:agent/fix-ams-persistence-bootstrap
