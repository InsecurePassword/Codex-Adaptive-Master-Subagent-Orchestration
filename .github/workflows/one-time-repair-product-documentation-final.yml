name: One-time repair product documentation final

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-public-product-documentation-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair and validate the document
        shell: bash
        run: python .github/repair_product_documentation.py

      - name: Commit the repair and remove temporary files
        shell: bash
        run: |
          rm -- .github/repair_product_documentation.py
          rm -- .github/workflows/one-time-repair-product-documentation.yml
          rm -- .github/workflows/one-time-repair-product-documentation-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'PRODUCT DOCUMENTATION.md' .github
          git diff --cached --check
          git commit -m "Repair public product documentation"
          git push origin HEAD:main

      - name: Close the repair PR and remove repair branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/repair-public-product-documentation" || true
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Product documentation repaired and validated. The corrupted directory block was replaced, no Unicode replacement characters remain, obsolete release references are absent, and the raw-main installer/package paths and current checksum are present."
