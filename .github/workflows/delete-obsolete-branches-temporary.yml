name: Delete obsolete AMS branches

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event.issue.number == 45 && github.event.comment.body == '/cleanup-obsolete-branches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete agent/ams-4.0-modular-governance agent/remove-post-update-reverification
