name: Delete obsolete AMS branches

on:
  schedule:
    - cron: '*/5 * * * *'
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'cleanup/delete-obsolete-branches-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Delete obsolete branches and report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          report='Branch cleanup results:'
          for branch in agent/ams-4.0-modular-governance agent/remove-post-update-reverification cleanup/delete-obsolete-branches-trigger; do
            if ! git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              report="${report}\n- ${branch}: already absent"
              continue
            fi
            output=$(git push origin --delete "${branch}" 2>&1)
            status=$?
            if [[ $status -eq 0 ]]; then
              report="${report}\n- ${branch}: deleted"
            else
              failed=1
              report="${report}\n- ${branch}: FAILED — ${output}"
            fi
          done
          printf '%b\n' "$report"
          gh issue comment 47 --body "$(printf '%b' "$report")"
          exit "$failed"
