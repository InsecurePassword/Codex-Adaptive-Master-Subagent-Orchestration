name: Delete obsolete AMS branches

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/remove-post-update-reverification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete agent/ams-4.0-modular-governance agent/remove-post-update-reverification
