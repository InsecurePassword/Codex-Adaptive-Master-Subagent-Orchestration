name: Delete obsolete AMS branches

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 45
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/agent/ams-4.0-modular-governance"
          gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/agent/remove-post-update-reverification"
