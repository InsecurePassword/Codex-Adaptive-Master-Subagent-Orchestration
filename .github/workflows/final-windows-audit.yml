name: Stage final Windows audit patch

on:
  push:
    branches:
      - final-windows-installation-audit-v2
    paths:
      - .github/.windows-audit-ready

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: final-windows-installation-audit-v2
          fetch-depth: 0

      - name: Reconstruct and apply audited change set
        shell: pwsh
        run: |
          $parts = Get-ChildItem .github -Filter '.windows-audit-patch-*' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 patch chunks; found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [System.IO.File]::WriteAllText((Join-Path $PWD '.github\.windows-audit-patch.b64'), $encoded, [System.Text.Encoding]::ASCII)
          @'
          from pathlib import Path
          import base64
          import lzma

          root = Path('.github')
          encoded = (root / '.windows-audit-patch.b64').read_bytes()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          (root / '.windows-audit.patch').write_bytes(patch)
          '@ | Set-Content .github\apply_windows_audit_patch.py -Encoding utf8
          python -B -E -s -S .github\apply_windows_audit_patch.py

          git rm .github/workflows/final-windows-audit.yml
          Get-ChildItem .github -Filter '.ams-audit-patch-*' -ErrorAction SilentlyContinue | ForEach-Object { git rm -- $_.FullName }
          git apply --index --whitespace=nowarn .github/.windows-audit.patch
          Remove-Item .github/.windows-audit-patch-* -Force
          Remove-Item .github/.windows-audit-ready -Force
          Remove-Item .github/.windows-audit-patch.b64 -Force
          Remove-Item .github/.windows-audit.patch -Force
          Remove-Item .github/apply_windows_audit_patch.py -Force
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete final Windows installation audit'
          git push origin HEAD:final-windows-installation-audit-v2
