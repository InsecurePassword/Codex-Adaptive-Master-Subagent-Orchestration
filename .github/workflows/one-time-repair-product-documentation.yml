name: One-time repair product documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-public-product-documentation'
    runs-on: ubuntu-latest
    steps:
      - name: Repair and validate product documentation
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.issue.number;
            const workflowPath = '.github/workflows/one-time-repair-product-documentation.yml';
            const branch = 'agent/repair-public-product-documentation';

            const directorySection = `## Directory structure

### Repository

\`\`\`text
Codex-Adaptive-Master-Subagent-Orchestration/
|-- README.md
|-- INSTALLATION.md
|-- PRODUCT DOCUMENTATION.md
|-- adaptive-master-subagent-orchestration-3.09.zip
|-- install.ps1
|-- install.sh
\`-- adaptive-master-subagent-orchestration/
    |-- SKILL.md
    |-- VERSION
    |-- agents/
    |   \`-- openai.yaml
    |-- assets/
    |   \`-- agent-profiles/
    |       \`-- 18 canonical ams_*.toml profiles
    \`-- references/
        |-- hierarchy-control.md
        |-- intensity-control.md
        |-- package-maintenance.md
        |-- profile-management.md
        |-- project-control.md
        |-- runtime-core.md
        \`-- zergling-rush.md
\`\`\`

### Installed skill

\`\`\`text
$HOME/.agents/skills/
\`-- adaptive-master-subagent-orchestration/
    |-- SKILL.md
    |-- VERSION
    |-- agents/
    |   \`-- openai.yaml
    |-- assets/
    |   \`-- agent-profiles/
    |       \`-- 18 canonical ams_*.toml profiles
    \`-- references/
        |-- hierarchy-control.md
        |-- intensity-control.md
        |-- package-maintenance.md
        |-- profile-management.md
        |-- project-control.md
        |-- runtime-core.md
        \`-- zergling-rush.md
\`\`\`

### Installed agent profiles

\`\`\`text
$CODEX_HOME/agents/
|-- ams_sol_low.toml
|-- ams_sol_medium.toml
|-- ams_sol_high.toml
|-- ams_sol_xhigh.toml
|-- ams_sol_max.toml
|-- ams_terra_low.toml
|-- ams_terra_medium.toml
|-- ams_terra_high.toml
|-- ams_terra_xhigh.toml
|-- ams_terra_max.toml
|-- ams_luna_low.toml
|-- ams_luna_medium.toml
|-- ams_luna_high.toml
|-- ams_luna_xhigh.toml
|-- ams_luna_max.toml
|-- ams_spark_low.toml
|-- ams_spark_medium.toml
\`-- ams_spark_high.toml
\`\`\`

When \`CODEX_HOME\` is unset, the installer uses \`$HOME/.codex/agents/\`.

### Project settings and optional recovery

\`\`\`text
<project-root>/
\`-- .codex/
    |-- ams-orchestration.toml
    \`-- ams-recovery.json  # only when no project-native state system is sufficient
\`\`\``;

            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'PRODUCT DOCUMENTATION.md',
              ref: 'main',
            });
            if (Array.isArray(response.data) || response.data.type !== 'file') {
              throw new Error('PRODUCT DOCUMENTATION.md is not a regular file');
            }

            let text = Buffer.from(response.data.content, response.data.encoding).toString('utf8');
            const startMarker = '## Directory structure';
            const endMarker = '## Troubleshooting';
            const start = text.indexOf(startMarker);
            const end = text.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0 || text.indexOf(startMarker, start + 1) >= 0 || text.indexOf(endMarker, end + 1) >= 0) {
              throw new Error('Directory/troubleshooting section boundaries are not unique');
            }

            text = text.slice(0, start) + directorySection + '\n\n' + text.slice(end);

            const forbidden = [
              '\uFFFD',
              'ReleaseZip',
              '/releases/download/',
              'virtual-hierarchy-final-audited',
              '74e48106fc26a6516db3e9f6cc15e66e745d4fe71e24fdee233a6cf972fe4514',
            ];
            for (const value of forbidden) {
              if (text.includes(value)) throw new Error(`Forbidden or corrupted content remains: ${value}`);
            }

            for (const required of [
              'f35aa28cad7c2691e80823e36ca276cbee8b20de067600fd8edb8f2aaf10fe4b',
              'assets/agent-profiles/',
              'ams_spark_high.toml',
              'raw/refs/heads/main/install.ps1',
              'raw/refs/heads/main/adaptive-master-subagent-orchestration-3.09.zip',
            ]) {
              if (!text.includes(required)) throw new Error(`Required public content is missing: ${required}`);
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'PRODUCT DOCUMENTATION.md',
              branch: 'main',
              message: 'Repair public product documentation',
              sha: response.data.sha,
              content: Buffer.from(text, 'utf8').toString('base64'),
            });

            const workflow = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: 'main' });
            if (!Array.isArray(workflow.data) && workflow.data.type === 'file') {
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path: workflowPath,
                branch: 'main',
                message: 'Remove temporary documentation repair workflow',
                sha: workflow.data.sha,
              });
            }

            await github.rest.pulls.update({ owner, repo, pull_number: pullNumber, state: 'closed' });
            try {
              await github.request('DELETE /repos/{owner}/{repo}/git/refs/{ref}', {
                owner,
                repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body: 'Product documentation repaired and validated: the corrupted directory block was replaced, no Unicode replacement characters remain, obsolete release references are absent, and the raw-main installer/package paths and current checksum are present.',
            });
