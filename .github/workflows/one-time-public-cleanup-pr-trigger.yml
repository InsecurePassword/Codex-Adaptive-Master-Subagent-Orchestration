name: One-time public cleanup PR trigger

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Clean public repository state
        uses: actions/github-script@v7
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const currentRunId = Number(process.env.CURRENT_RUN_ID);
            const currentPullNumber = context.issue.number;

            const decode = value => Buffer.from(value, 'base64').toString('utf8');
            const installation = decode('');
            const profiles = decode('');
            const directory = decode('');
            const missingProfile = decode('');
            const checksum = decode('');
            const entries = decode('');

            function replaceExactOnce(text, oldValue, newValue, label) {
              const count = text.split(oldValue).length - 1;
              if (count !== 1) throw new Error(`${label}: expected one match; found ${count}`);
              return text.replace(oldValue, newValue);
            }

            function replaceSection(text, start, end, replacement, label) {
              const escape = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`${escape(start)}\\n[\\s\\S]*?\\n${escape(end)}`);
              const matches = text.match(pattern);
              if (!matches || matches.length !== 1) throw new Error(`${label}: section not found exactly once`);
              return text.replace(pattern, `${replacement}\n\n${end}`);
            }

            async function getTextFile(path) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`${path} is not a regular file`);
              }
              return {
                sha: response.data.sha,
                text: Buffer.from(response.data.content, response.data.encoding).toString('utf8'),
              };
            }

            async function putTextFile(path, text, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch: 'main',
                message,
                sha,
                content: Buffer.from(text, 'utf8').toString('base64'),
              });
            }

            async function deletePath(path, message) {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                if (Array.isArray(response.data) || response.data.type !== 'file') return false;
                await github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path,
                  branch: 'main',
                  message,
                  sha: response.data.sha,
                });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function paged(route, params, key = null) {
              const all = [];
              for (let page = 1; ; page += 1) {
                const response = await github.request(route, { owner, repo, per_page: 100, page, ...params });
                const batch = key ? response.data[key] : response.data;
                all.push(...batch);
                if (batch.length < 100) break;
              }
              return all;
            }

            const report = {
              deletedBranches: [],
              skippedBranches: [],
              deletedReleases: [],
              deletedTags: [],
              deletedArtifacts: 0,
              deletedCaches: 0,
              deletedWorkflowRuns: 0,
              errors: [],
            };

            const oldRuntimeSentence = 'The installed skill contains Markdown, YAML, and a version file only. Shell tools are used for installation and maintenance, not while AMS is orchestrating project work.';
            const newRuntimeSentence = 'The installed skill contains Markdown, YAML, TOML agent profiles, and a version file. Shell tools are used for installation and maintenance, not while AMS is orchestrating project work.';

            const product = await getTextFile('PRODUCT DOCUMENTATION.md');
            let text = replaceExactOnce(product.text, oldRuntimeSentence, newRuntimeSentence, 'installed skill sentence');
            text = replaceSection(text, '## Installation', '## Starting and stopping AMS', installation, 'installation');
            text = replaceSection(text, '## Agent profile management', '## Validation and completion', profiles, 'agent profiles');
            text = replaceSection(text, '## Directory structure', '## Troubleshooting', directory, 'directory structure');
            text = replaceSection(text, '### A profile is missing or invalid', '### The package reports', missingProfile, 'missing profile troubleshooting');
            text = replaceSection(text, '### The checksum does not match', '### The installer reports', checksum, 'checksum troubleshooting');
            text = replaceSection(text, '### The installer reports an unexpected directory entry', '### The skill changed', entries, 'directory entry troubleshooting');

            for (const forbidden of [
              'ReleaseZip',
              '/releases/download/',
              'virtual-hierarchy-final-audited',
              '74e48106fc26a6516db3e9f6cc15e66e745d4fe71e24fdee233a6cf972fe4514',
            ]) {
              if (text.includes(forbidden)) throw new Error(`obsolete public reference remains: ${forbidden}`);
            }

            await putTextFile('PRODUCT DOCUMENTATION.md', text, product.sha, 'Reconcile public product documentation');

            await deletePath('.github/workflows/one-time-public-repository-cleanup.yml', 'Remove temporary public cleanup workflow');
            await deletePath('.github/public-cleanup-trigger', 'Remove temporary public cleanup trigger');
            await deletePath('.github/workflows/one-time-public-cleanup-pr-trigger.yml', 'Remove temporary PR cleanup workflow');

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            await github.rest.repos.update({ owner, repo, delete_branch_on_merge: true });

            const releases = await paged('GET /repos/{owner}/{repo}/releases', {});
            for (const release of releases) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/releases/{release_id}', {
                  owner,
                  repo,
                  release_id: release.id,
                });
                report.deletedReleases.push({ id: release.id, tag: release.tag_name, name: release.name });
              } catch (error) {
                report.errors.push(`release ${release.id}: ${error.message}`);
              }
            }

            const tags = await paged('GET /repos/{owner}/{repo}/tags', {});
            for (const tag of tags) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/git/refs/{ref}', {
                  owner,
                  repo,
                  ref: `tags/${tag.name}`,
                });
                report.deletedTags.push(tag.name);
              } catch (error) {
                report.errors.push(`tag ${tag.name}: ${error.message}`);
              }
            }

            try {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: '3.09',
                target_commitish: defaultBranch,
                name: 'Adaptive Master–Subagent Orchestration 3.09',
                body: [
                  'First public release of Adaptive Master–Subagent Orchestration 3.09.',
                  '',
                  'The live installers and verified package are maintained directly on the `main` branch.',
                  '',
                  `PowerShell: \`powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm 'https://github.com/${repoFullName}/raw/refs/heads/main/install.ps1' | iex"\``,
                  '',
                  `Bash: \`curl -fsSL 'https://github.com/${repoFullName}/raw/refs/heads/main/install.sh' | bash\``,
                  '',
                  'Package SHA-256: `f35aa28cad7c2691e80823e36ca276cbee8b20de067600fd8edb8f2aaf10fe4b`',
                ].join('\n'),
                draft: false,
                prerelease: false,
                generate_release_notes: false,
              });
            } catch (error) {
              report.errors.push(`create release 3.09: ${error.message}`);
            }

            const artifacts = await paged('GET /repos/{owner}/{repo}/actions/artifacts', {}, 'artifacts');
            for (const artifact of artifacts) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                report.deletedArtifacts += 1;
              } catch (error) {
                report.errors.push(`artifact ${artifact.id}: ${error.message}`);
              }
            }

            try {
              const caches = await paged('GET /repos/{owner}/{repo}/actions/caches', {}, 'actions_caches');
              for (const cache of caches) {
                try {
                  await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                    owner,
                    repo,
                    cache_id: cache.id,
                  });
                  report.deletedCaches += 1;
                } catch (error) {
                  report.errors.push(`cache ${cache.id}: ${error.message}`);
                }
              }
            } catch (error) {
              report.errors.push(`cache inventory: ${error.message}`);
            }

            const runs = await paged('GET /repos/{owner}/{repo}/actions/runs', {}, 'workflow_runs');
            for (const run of runs) {
              if (run.id === currentRunId) continue;
              try {
                await github.request('DELETE /repos/{owner}/{repo}/actions/runs/{run_id}', {
                  owner,
                  repo,
                  run_id: run.id,
                });
                report.deletedWorkflowRuns += 1;
              } catch (error) {
                report.errors.push(`workflow run ${run.id}: ${error.message}`);
              }
            }

            try {
              await github.rest.pulls.update({ owner, repo, pull_number: currentPullNumber, state: 'closed' });
            } catch (error) {
              report.errors.push(`close cleanup PR ${currentPullNumber}: ${error.message}`);
            }

            const openPulls = await paged('GET /repos/{owner}/{repo}/pulls', { state: 'open' });
            const openHeadBranches = new Set(
              openPulls
                .filter(pr => pr.head?.repo?.full_name === repoFullName)
                .map(pr => pr.head.ref),
            );

            const branches = await paged('GET /repos/{owner}/{repo}/branches', {});
            for (const branch of branches) {
              if (branch.name === defaultBranch || branch.protected || openHeadBranches.has(branch.name)) {
                report.skippedBranches.push({
                  name: branch.name,
                  protected: branch.protected,
                  openPullRequest: openHeadBranches.has(branch.name),
                });
                continue;
              }
              try {
                await github.request('DELETE /repos/{owner}/{repo}/git/refs/{ref}', {
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                report.deletedBranches.push(branch.name);
              } catch (error) {
                report.errors.push(`branch ${branch.name}: ${error.message}`);
              }
            }

            console.log(JSON.stringify(report, null, 2));
            await core.summary
              .addHeading('Public repository cleanup')
              .addRaw(`Deleted branches: ${report.deletedBranches.length}\n`)
              .addRaw(`Deleted old releases: ${report.deletedReleases.length}\n`)
              .addRaw(`Deleted old tags: ${report.deletedTags.length}\n`)
              .addRaw(`Deleted Actions artifacts: ${report.deletedArtifacts}\n`)
              .addRaw(`Deleted Actions caches: ${report.deletedCaches}\n`)
              .addRaw(`Deleted old workflow runs: ${report.deletedWorkflowRuns}\n`)
              .addRaw(`Non-fatal cleanup errors: ${report.errors.length}\n`)
              .write();
