name: Apply PR 44 PowerShell lock correction

on:
  push:
    branches:
      - agent/ams-4.0-modular-governance
    paths:
      - .github/workflows/apply-pr44-lock-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Correct PowerShell ownerless-lock acquisition ordering
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('install.ps1')
          text = path.read_text(encoding='utf-8')
          old = """function Acquire-SharedRuntimeLock {\n    foreach ($Attempt in 1..3) {\n        try { Publish-SharedRuntimeLock; return }\n        catch {\n            if (-not (Test-Path -LiteralPath $LockPath)) { if ($Attempt -eq 3) { throw }; continue }\n        }\n        $OwnerPath = Join-Path $LockPath 'owner.log'\n"""
          new = """function Acquire-SharedRuntimeLock {\n    foreach ($Attempt in 1..3) {\n        if (-not (Test-Path -LiteralPath $LockPath)) {\n            try { Publish-SharedRuntimeLock; return }\n            catch {\n                if (-not (Test-Path -LiteralPath $LockPath)) { if ($Attempt -eq 3) { throw }; continue }\n            }\n        }\n        $OwnerPath = Join-Path $LockPath 'owner.log'\n"""
          if text.count(old) != 1:
              raise SystemExit('unexpected PowerShell lock acquisition baseline')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/apply-pr44-lock-fix.yml
      - name: Verify correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python verification/verify_repository.py
          python verification/verify_contract_scenarios.py
          python -m py_compile verification/verify_installers.py
          git diff --check
      - name: Create corrective commit
        shell: bash
        env:
          TARGET_BRANCH: agent/ams-4.0-modular-governance
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name "InsecurePassword"
          git config user.email "107284711+InsecurePassword@users.noreply.github.com"
          git add -A
          git commit -m "Fix PowerShell ownerless-lock recovery"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${TARGET_BRANCH}"
