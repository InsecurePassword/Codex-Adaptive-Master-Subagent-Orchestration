name: Temporary cleanup merged hardening branches

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cleanup-merged-hardening-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and cleanup branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/harden-ams-core-boundaries" >/dev/null 2>&1 || true
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Merged hardening branch cleanup completed."
