name: PowerShell installer diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Download release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'release') | Out-Null
          gh release download ReleaseZip --repo $env:GITHUB_REPOSITORY --pattern 'adaptive-master-subagent-orchestration-3.08.zip' --dir (Join-Path $env:RUNNER_TEMP 'release')
      - name: Run and capture PowerShell installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Join-Path $env:RUNNER_TEMP 'release\adaptive-master-subagent-orchestration-3.08.zip'
          $Sha = (Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $Serve = Split-Path $Zip -Parent
          $Python = (Get-Command python).Source
          $Server = Start-Process -FilePath $Python -ArgumentList @('-m','http.server','8766','--bind','127.0.0.1','--directory',$Serve) -PassThru -WindowStyle Hidden
          $Out = Join-Path $env:RUNNER_TEMP 'installer.stdout.txt'
          $Err = Join-Path $env:RUNNER_TEMP 'installer.stderr.txt'
          $Tree = Join-Path $env:RUNNER_TEMP 'installer.tree.txt'
          $Exit = Join-Path $env:RUNNER_TEMP 'installer.exit.txt'
          try {
            Start-Sleep -Seconds 2
            $env:AMS_RELEASE_URL = 'http://127.0.0.1:8766/' + [IO.Path]::GetFileName($Zip)
            $env:AMS_EXPECTED_SHA256 = $Sha
            $env:AMS_SKILL_HOME = Join-Path $env:RUNNER_TEMP 'ps-diagnostic-skills'
            $Process = Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',(Resolve-Path .\install.ps1).Path) -RedirectStandardOutput $Out -RedirectStandardError $Err -PassThru -Wait
            "ExitCode=$($Process.ExitCode)" | Set-Content -LiteralPath $Exit
            if (Test-Path $env:AMS_SKILL_HOME) {
              Get-ChildItem -LiteralPath $env:AMS_SKILL_HOME -Recurse -Force | Select-Object FullName,Attributes,Length | Format-Table -AutoSize | Out-String -Width 300 | Set-Content -LiteralPath $Tree
            } else {
              'Skill home missing' | Set-Content -LiteralPath $Tree
            }
            if ($Process.ExitCode -ne 0) { throw "Installer exited $($Process.ExitCode)" }
          }
          finally {
            Stop-Process -Id $Server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-installer-diagnostic
          path: ${{ runner.temp }}/installer.*.txt
          if-no-files-found: error
