name: Temporary finalize AMS core runtime simplification

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/core-runtime-simplify-helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-runtime-simplify-helper
          fetch-depth: 0

      - name: Apply and verify core runtime simplification
        shell: bash
        run: |
          git fetch origin main agent/remove-post-update-reverification
          python3 .github/ams-core-simplify/finalize.py | tee /tmp/ams-core-simplify.txt
          bash -n install.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))'
          grep -q '^MANIFEST_FILES=31$' /tmp/ams-core-simplify.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          lines = Path('install-manifest.txt').read_text(encoding='utf-8').splitlines()
          assert lines[:2] == ['ams-install-manifest-v1', 'version\t3.09']
          assert len(lines[2:]) == 31
          for line in lines[2:]:
              digest, length, path = line.split('\t')
              data = Path(path).read_bytes()
              assert len(data) == int(length), path
              assert hashlib.sha256(data).hexdigest() == digest, path
          PY

      - name: Commit finalized PR branch
        shell: bash
        run: |
          rm -rf -- .github/ams-core-simplify
          rm -- .github/workflows/temporary-finalize-core-runtime-simplification.yml
          git fetch origin main
          git reset --mixed origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Simplify AMS runtime and remove package revalidation'
          git push --force-with-lease origin HEAD:agent/remove-post-update-reverification
