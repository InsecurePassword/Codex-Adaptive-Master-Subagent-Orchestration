name: Apply Windows audit fixes

on:
  push:
    branches:
      - windows-final-third-party-audit
    paths:
      - ".github/.windows-audit-payload-*"
      - ".github/workflows/apply-windows-audit-fixes.yml"
  pull_request:
    branches:
      - post-merge-release-audit
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: windows-final-third-party-audit
          fetch-depth: 0

      - name: Reconstruct exact Windows audit payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = @(Get-ChildItem -LiteralPath .github -Filter ".windows-audit-payload-*" | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "Expected five payload chunks; found $($parts.Count)." }
          $encoded = ($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::ASCII).Trim() }) -join ""
          $payload = [Convert]::FromBase64String($encoded)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try { $digest = ([BitConverter]::ToString($sha.ComputeHash($payload))).Replace("-", "").ToLowerInvariant() }
          finally { $sha.Dispose() }
          if ($digest -cne "b1fb29b702aaa1236dfea89e345f9b86dc4a20a2ce64df83c1b9d0cd6cf4fec7") { throw "Payload digest mismatch: $digest" }
          $zip = Join-Path $env:RUNNER_TEMP "windows-audit-payload.zip"
          [System.IO.File]::WriteAllBytes($zip, $payload)
          Expand-Archive -LiteralPath $zip -DestinationPath $PWD -Force

      - name: Apply source transformations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TransformPath = Join-Path $PWD ".windows-audit-transform.py"
          $Text = [System.IO.File]::ReadAllText($TransformPath, [System.Text.Encoding]::UTF8)
          $Old = 'for name in ("install_package.py", "bootstrap_profiles.py", "set_intensity.py", "validate_package.py"):'
          $New = 'for name in ("install_package.py", "bootstrap_profiles.py", "set_intensity.py"):'
          if (-not $Text.Contains($Old)) { throw "Expected Python import target tuple was not found." }
          [System.IO.File]::WriteAllText($TransformPath, $Text.Replace($Old, $New), [System.Text.UTF8Encoding]::new($false))
          python -B -E -s -S .\.windows-audit-transform.py *> .\windows-audit-transform.log
          $ExitCode = $LASTEXITCODE
          Get-Content -LiteralPath .\windows-audit-transform.log
          if ($ExitCode -ne 0) { exit $ExitCode }

      - name: Upload transform failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-audit-transform-failure
          path: windows-audit-transform.log
          if-no-files-found: error

      - name: Regenerate and verify manifests
        shell: pwsh
        run: |
          python -B -E -s -S .\scripts\refresh_manifests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -E -s -S .\scripts\refresh_manifests.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run static source audits
        shell: pwsh
        run: |
          python -B -E -s -S .\scripts\audit_markdown.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -E -s -S -c "from pathlib import Path; [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in Path('.').rglob('*.py') if '__pycache__' not in p.parts]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse all PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Error ($_.FullName + ": " + (($errors | ForEach-Object Message) -join "; "))
            }
          }
          if ($failed) { exit 1 }

      - name: Parse all PowerShell with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Error ($_.FullName + ": " + (($errors | ForEach-Object Message) -join "; "))
            }
          }
          if ($failed) { exit 1 }

      - name: Remove audit staging files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = @(Get-ChildItem -LiteralPath .github -Filter ".windows-audit-payload-*")
          Remove-Item -LiteralPath .\.windows-audit-transform.py -Force
          Remove-Item -LiteralPath .\windows-audit-transform.log -Force -ErrorAction SilentlyContinue
          $parts | Remove-Item -Force
          Remove-Item -LiteralPath .\.github\workflows\apply-windows-audit-fixes.yml -Force

      - name: Stage and validate exact diff
        shell: pwsh
        run: |
          git add --all
          git status --short
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exact Windows audit corrections
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete independent Windows installation audit coverage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Push isolated audit branch
        shell: pwsh
        run: |
          git push origin HEAD:windows-final-third-party-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export validated commit after push rejection
        if: failure()
        shell: pwsh
        run: |
          git format-patch -1 --stdout HEAD | Set-Content -LiteralPath .\windows-audit-final.patch -Encoding utf8
          git archive --format=zip --output=.\windows-audit-final.zip HEAD
          git show --stat --oneline HEAD

      - name: Upload validated Windows audit commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-audit-final-commit
          path: |
            windows-audit-final.patch
            windows-audit-final.zip
          if-no-files-found: error
