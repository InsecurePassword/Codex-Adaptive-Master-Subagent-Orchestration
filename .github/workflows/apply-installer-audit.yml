name: Apply installer audit

on:
  push:
    branches:
      - installer-audit-complete
    paths:
      - ".github/workflows/apply-installer-audit.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: installer-audit-complete
          fetch-depth: 0

      - name: Apply audited installer sources
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 -B -E -s -S .installer-generator/apply.py > installer-apply.log 2>&1
          status=$?
          cat installer-apply.log
          exit $status

      - name: Upload generator failure
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: installer-apply-error
          path: installer-apply.log

      - name: Stop after generator failure
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Run complete offline installer audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 -B -E -s -S scripts/audit_installers.py > installer-audit.log 2>&1
          status=$?
          cat installer-audit.log
          exit $status

      - name: Upload audit failure
        if: steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: installer-audit-error
          path: installer-audit.log

      - name: Stop after audit failure
        if: steps.audit.outcome == 'failure'
        run: exit 1

      - name: Remove publication scaffolding
        shell: bash
        run: |
          rm -rf .installer-generator .installer-payload
          rm -f installer-apply.log installer-audit.log
          rm -f .github/workflows/apply-installer-audit.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit verified installer implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete installer audit and hardening [skip ci]"
          git push origin HEAD:installer-audit-complete
