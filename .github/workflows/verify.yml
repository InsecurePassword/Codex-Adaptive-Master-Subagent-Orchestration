name: Verify AMS 4.0 release architecture

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-pr44-platform-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ams-4.0-modular-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply reviewed cross-platform verification fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          attributes = Path('.gitattributes')
          text = attributes.read_text(encoding='utf-8')
          if not text.startswith('* text=auto\n'):
              raise SystemExit('unexpected .gitattributes baseline')
          attributes.write_text(text.replace('* text=auto\n', '* text=auto eol=lf\n', 1), encoding='utf-8', newline='\n')

          verifier = Path('verification/verify_installers.py')
          text = verifier.read_text(encoding='utf-8')
          needle = '    for _ in range(100):\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected fixture-server startup loop')
          verifier.write_text(text.replace(needle, '    for _ in range(500):\n'), encoding='utf-8', newline='\n')
          PY
          git checkout d3e190bcf0430d43e97894af5b78f5a5b8a177ee -- .github/workflows/verify.yml
      - name: Verify corrected candidate before publication
        shell: bash
        run: |
          set -Eeuo pipefail
          python verification/verify_repository.py
          python verification/verify_contract_scenarios.py
          python verification/verify_installers.py
          python verification/verify_runtime_observation.py
          python tools/measure_context.py --json --check > /tmp/context.json
          python tools/report_sizes.py --format json > /tmp/sizes.json
          bash -n install.sh
          python -m py_compile verification/verify_repository.py verification/verify_contract_scenarios.py verification/verify_installers.py verification/verify_runtime_observation.py tools/measure_context.py tools/report_sizes.py extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check
      - name: Publish one cross-platform verification commit
        shell: bash
        env:
          TARGET_BRANCH: agent/ams-4.0-modular-governance
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name "InsecurePassword"
          git config user.email "107284711+InsecurePassword@users.noreply.github.com"
          git add -A
          git commit -m "Fix cross-platform release verification"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${TARGET_BRANCH}"

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'agent/ams-4.0-modular-governance'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile repository verification
        run: >-
          python -m py_compile
          verification/verify_repository.py
          verification/verify_contract_scenarios.py
          verification/verify_installers.py
          verification/verify_runtime_observation.py
          tools/measure_context.py
          tools/report_sizes.py
          extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
      - name: Verify package and contracts
        run: python verification/verify_repository.py
      - name: Verify configuration and feature interactions
        run: python verification/verify_contract_scenarios.py
      - name: Verify installer transactions
        run: python verification/verify_installers.py
      - name: Verify runtime-observation companion
        run: python verification/verify_runtime_observation.py
      - name: Verify deterministic context and budgets
        run: |
          python tools/measure_context.py --json --check > context-1.json
          python tools/measure_context.py --json --check > context-2.json
          python -c "from pathlib import Path; assert Path('context-1.json').read_bytes() == Path('context-2.json').read_bytes()"
      - name: Verify deterministic immediate-baseline size report
        run: |
          python tools/report_sizes.py --format json > size-1.json
          python tools/report_sizes.py --format json > size-2.json
          python -c "from pathlib import Path; assert Path('size-1.json').read_bytes() == Path('size-2.json').read_bytes()"
      - name: Parse Bash installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh
      - name: Parse PowerShell installer and observation helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath ./install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./extensions/ams-runtime-observation/tools/Inspect-AgentRuntime.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./verification/Verify-RuntimeObservation.ps1 -Raw))
      - name: PowerShell runtime-observation fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\verification\Verify-RuntimeObservation.ps1
