name: Verify AMS 4.0 release architecture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile repository verification
        run: >-
          python -m py_compile
          verification/verify_repository.py
          verification/verify_contract_scenarios.py
          verification/verify_installers.py
          verification/verify_installers_windows.py
          verification/verify_runtime_observation.py
          tools/measure_context.py
          tools/report_sizes.py
          extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
      - name: Verify package and contracts
        run: python verification/verify_repository.py
      - name: Verify configuration and feature interactions
        run: python verification/verify_contract_scenarios.py
      - name: Verify installer transactions
        if: runner.os != 'Windows'
        run: python verification/verify_installers.py
      - name: Verify installer transactions (Windows)
        if: runner.os == 'Windows'
        run: python verification/verify_installers_windows.py
      - name: Verify runtime-observation companion
        run: python verification/verify_runtime_observation.py
      - name: Verify deterministic context and budgets
        run: |
          python tools/measure_context.py --json --check > context-1.json
          python tools/measure_context.py --json --check > context-2.json
          python -c "from pathlib import Path; assert Path('context-1.json').read_bytes() == Path('context-2.json').read_bytes()"
      - name: Verify deterministic immediate-baseline size report
        run: |
          python tools/report_sizes.py --format json > size-1.json
          python tools/report_sizes.py --format json > size-2.json
          python -c "from pathlib import Path; assert Path('size-1.json').read_bytes() == Path('size-2.json').read_bytes()"
      - name: Parse Bash installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh
      - name: Parse PowerShell installer and observation helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath ./install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./extensions/ams-runtime-observation/tools/Inspect-AgentRuntime.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./verification/Verify-RuntimeObservation.ps1 -Raw))
      - name: PowerShell runtime-observation fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\verification\Verify-RuntimeObservation.ps1
