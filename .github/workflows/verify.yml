name: Verify AMS 4.0 release architecture

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-pr44-windows-fixture-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ams-4.0-modular-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply reviewed Windows stale-lock fixture correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('verification/verify_installers.py')
          text = path.read_text(encoding='utf-8')
          insertion = '''\n\ndef make_directory_stale(path: Path) -> None:\n    if os.name == "nt":\n        executable = shutil.which("powershell.exe") or shutil.which("powershell")\n        if not executable:\n            raise AssertionError("PowerShell unavailable for Windows stale-directory fixture")\n        environment = os.environ.copy()\n        environment["AMS_TEST_STALE_DIRECTORY"] = str(path)\n        result = subprocess.run(\n            [\n                executable,\n                "-NoProfile",\n                "-Command",\n                "$p=$env:AMS_TEST_STALE_DIRECTORY; [IO.Directory]::SetLastWriteTimeUtc($p,[DateTime]'2000-01-01T00:00:00Z')",\n            ],\n            text=True,\n            capture_output=True,\n            env=environment,\n        )\n        if result.returncode != 0:\n            raise AssertionError(f"could not age ownerless lock fixture: {result.stdout}\\n{result.stderr}")\n    else:\n        os.utime(path, (1, 1))\n    if time.time() - path.stat().st_mtime <= 30:\n        raise AssertionError("ownerless lock fixture did not age beyond the initialization grace")\n'''
          point = 'def tracking_record(generation: int = 1) -> tuple[str, str]:\n'
          if text.count(point) != 1:
              raise SystemExit('unexpected helper insertion point')
          text = text.replace(point, insertion + '\n' + point, 1)
          old = '        os.utime(lock_path, (1, 1))\n        invoke()\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected ownerless-lock fixture')
          text = text.replace(old, '        make_directory_stale(lock_path)\n        invoke()\n', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git checkout 809a3faa1c8c13cf5efbcf49f4bb6db903cb41d6 -- .github/workflows/verify.yml
      - name: Verify correction before publication
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile verification/verify_installers.py
          python verification/verify_repository.py
          python verification/verify_contract_scenarios.py
          git diff --check
      - name: Publish one fixture correction commit
        shell: bash
        env:
          TARGET_BRANCH: agent/ams-4.0-modular-governance
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name "InsecurePassword"
          git config user.email "107284711+InsecurePassword@users.noreply.github.com"
          git add -A
          git commit -m "Fix Windows stale-lock verification fixture"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${TARGET_BRANCH}"

  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'agent/ams-4.0-modular-governance'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile repository verification
        run: >-
          python -m py_compile
          verification/verify_repository.py
          verification/verify_contract_scenarios.py
          verification/verify_installers.py
          verification/verify_runtime_observation.py
          tools/measure_context.py
          tools/report_sizes.py
          extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
      - name: Verify package and contracts
        run: python verification/verify_repository.py
      - name: Verify configuration and feature interactions
        run: python verification/verify_contract_scenarios.py
      - name: Verify installer transactions
        run: python verification/verify_installers.py
      - name: Verify runtime-observation companion
        run: python verification/verify_runtime_observation.py
      - name: Verify deterministic context and budgets
        run: |
          python tools/measure_context.py --json --check > context-1.json
          python tools/measure_context.py --json --check > context-2.json
          python -c "from pathlib import Path; assert Path('context-1.json').read_bytes() == Path('context-2.json').read_bytes()"
      - name: Verify deterministic immediate-baseline size report
        run: |
          python tools/report_sizes.py --format json > size-1.json
          python tools/report_sizes.py --format json > size-2.json
          python -c "from pathlib import Path; assert Path('size-1.json').read_bytes() == Path('size-2.json').read_bytes()"
      - name: Parse Bash installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh
      - name: Parse PowerShell installer and observation helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath ./install.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./extensions/ams-runtime-observation/tools/Inspect-AgentRuntime.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./verification/Verify-RuntimeObservation.ps1 -Raw))
      - name: PowerShell runtime-observation fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\verification\Verify-RuntimeObservation.ps1
