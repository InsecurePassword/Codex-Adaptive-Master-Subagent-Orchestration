name: Installer audit

on:
  pull_request:
    paths:
      - install.ps1
      - install.sh
      - .github/workflows/installer-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-installer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Download published release asset
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download ReleaseZip --repo "$GITHUB_REPOSITORY" --pattern 'adaptive-master-subagent-orchestration-3.08.zip' --dir "$RUNNER_TEMP/release"
          sha256sum "$RUNNER_TEMP/release/adaptive-master-subagent-orchestration-3.08.zip"
      - name: Bash lifecycle and safety
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ./install.sh
          zip="$RUNNER_TEMP/release/adaptive-master-subagent-orchestration-3.08.zip"
          sha="$(sha256sum "$zip" | awk '{print $1}')"
          test "$sha" = 'e45eed1762ed24d1a0f671d9fb7424558694f0bef557aaca97f0cc0828d07be6'
          home="$RUNNER_TEMP/bash-home"
          mkdir -p "$home"
          HOME="$home" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$sha" bash ./install.sh
          test -f "$home/.agents/skills/adaptive-master-subagent-orchestration/SKILL.md"
          test "$(cat "$home/.agents/skills/adaptive-master-subagent-orchestration/VERSION")" = '3.08'
          mkdir -p "$home/.agents/skills/unrelated"
          echo keep > "$home/.agents/skills/unrelated/SKILL.md"
          echo stale > "$home/.agents/skills/adaptive-master-subagent-orchestration/stale.txt"
          HOME="$home" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$sha" bash ./install.sh
          test -f "$home/.agents/skills/unrelated/SKILL.md"
          test ! -e "$home/.agents/skills/adaptive-master-subagent-orchestration/stale.txt"
          set +e
          HOME="$home" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$(printf '0%.0s' {1..64})" bash ./install.sh >bad.out 2>bad.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -qi 'checksum mismatch' bad.err
          test -f "$home/.agents/skills/adaptive-master-subagent-orchestration/SKILL.md"
          locked="$RUNNER_TEMP/bash-locked"
          mkdir -p "$locked/.adaptive-master-subagent-orchestration.install.lock"
          set +e
          AMS_SKILL_HOME="$locked" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$sha" bash ./install.sh >lock.out 2>lock.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -qi 'another installation is active' lock.err
      - name: Bash authenticated private-release path
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          home="$RUNNER_TEMP/bash-private"
          mkdir -p "$home"
          HOME="$home" bash ./install.sh
          test -f "$home/.agents/skills/adaptive-master-subagent-orchestration/SKILL.md"

  powershell-installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Download published release asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'release') | Out-Null
          gh release download ReleaseZip --repo $env:GITHUB_REPOSITORY --pattern 'adaptive-master-subagent-orchestration-3.08.zip' --dir (Join-Path $env:RUNNER_TEMP 'release')
          Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:RUNNER_TEMP 'release\adaptive-master-subagent-orchestration-3.08.zip')
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count -ne 0) { $Errors | Format-List | Out-String | Write-Error }
      - name: PowerShell lifecycle and safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Join-Path $env:RUNNER_TEMP 'release\adaptive-master-subagent-orchestration-3.08.zip'
          $Sha = (Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Sha -ne 'e45eed1762ed24d1a0f671d9fb7424558694f0bef557aaca97f0cc0828d07be6') { throw "Published checksum mismatch: $Sha" }
          $Serve = Split-Path $Zip -Parent
          $Python = (Get-Command python).Source
          $Server = Start-Process -FilePath $Python -ArgumentList @('-m','http.server','8765','--bind','127.0.0.1','--directory',$Serve) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $env:AMS_RELEASE_URL = 'http://127.0.0.1:8765/' + [IO.Path]::GetFileName($Zip)
            $env:AMS_EXPECTED_SHA256 = $Sha
            $env:AMS_SKILL_HOME = Join-Path $env:RUNNER_TEMP 'ps-skills'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "Clean installer exited $LASTEXITCODE" }
            $Root = Join-Path $env:AMS_SKILL_HOME 'adaptive-master-subagent-orchestration'
            if (-not (Test-Path (Join-Path $Root 'SKILL.md'))) { throw 'Clean install failed.' }
            New-Item -ItemType Directory -Force -Path (Join-Path $env:AMS_SKILL_HOME 'unrelated') | Out-Null
            Set-Content -LiteralPath (Join-Path $env:AMS_SKILL_HOME 'unrelated\SKILL.md') -Value keep
            Set-Content -LiteralPath (Join-Path $Root 'stale.txt') -Value stale
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "Update installer exited $LASTEXITCODE" }
            if (-not (Test-Path (Join-Path $env:AMS_SKILL_HOME 'unrelated\SKILL.md'))) { throw 'Unrelated skill was removed.' }
            if (Test-Path (Join-Path $Root 'stale.txt')) { throw 'Update did not replace the old skill root.' }
            $env:AMS_EXPECTED_SHA256 = ('0' * 64)
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if ($LASTEXITCODE -eq 0) { throw 'Checksum mismatch unexpectedly succeeded.' }
            if (-not (Test-Path (Join-Path $Root 'SKILL.md'))) { throw 'Checksum failure damaged existing install.' }
          }
          finally {
            Stop-Process -Id $Server.Id -Force -ErrorAction SilentlyContinue
            Remove-Item Env:AMS_RELEASE_URL, Env:AMS_EXPECTED_SHA256, Env:AMS_SKILL_HOME -ErrorAction SilentlyContinue
          }
      - name: PowerShell authenticated private-release path
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AMS_SKILL_HOME = Join-Path $env:RUNNER_TEMP 'ps-private'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "Private release installer exited $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:AMS_SKILL_HOME 'adaptive-master-subagent-orchestration\SKILL.md'))) { throw 'Private release install failed.' }
