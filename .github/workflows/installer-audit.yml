name: Installer audit

on:
  pull_request:
    paths: [install.ps1, install.sh, .github/workflows/installer-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download published asset
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download ReleaseZip --repo "$GITHUB_REPOSITORY" --pattern 'adaptive-master-subagent-orchestration-3.08.zip' --dir "$RUNNER_TEMP/release"
      - name: Test Bash installer
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ./install.sh
          zip="$RUNNER_TEMP/release/adaptive-master-subagent-orchestration-3.08.zip"
          sha="$(sha256sum "$zip" | awk '{print $1}')"
          test "$sha" = e45eed1762ed24d1a0f671d9fb7424558694f0bef557aaca97f0cc0828d07be6
          home="$RUNNER_TEMP/bash-home"
          HOME="$home" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$sha" bash ./install.sh
          test -f "$home/.agents/skills/adaptive-master-subagent-orchestration/SKILL.md"
          mkdir -p "$home/.agents/skills/unrelated"
          echo keep > "$home/.agents/skills/unrelated/SKILL.md"
          echo stale > "$home/.agents/skills/adaptive-master-subagent-orchestration/stale.txt"
          HOME="$home" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$sha" bash ./install.sh
          test -f "$home/.agents/skills/unrelated/SKILL.md"
          test ! -e "$home/.agents/skills/adaptive-master-subagent-orchestration/stale.txt"
          set +e
          HOME="$home" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$(printf '0%.0s' {1..64})" bash ./install.sh 2>bad.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -qi 'checksum mismatch' bad.err
          lockhome="$RUNNER_TEMP/bash-lock"
          mkdir -p "$lockhome/.adaptive-master-subagent-orchestration.install.lock"
          set +e
          AMS_SKILL_HOME="$lockhome" AMS_RELEASE_URL="file://$zip" AMS_EXPECTED_SHA256="$sha" bash ./install.sh 2>lock.err
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -qi 'another installation is active' lock.err
      - name: Test Bash private release path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          HOME="$RUNNER_TEMP/bash-private" bash ./install.sh
          test -f "$RUNNER_TEMP/bash-private/.agents/skills/adaptive-master-subagent-orchestration/SKILL.md"

  powershell:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download published asset
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'release') | Out-Null
          gh release download ReleaseZip --repo $env:GITHUB_REPOSITORY --pattern 'adaptive-master-subagent-orchestration-3.08.zip' --dir (Join-Path $env:RUNNER_TEMP 'release')
      - name: Parse and test Windows PowerShell 5.1 installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw ($errors|Out-String)}
          $zip=Join-Path $env:RUNNER_TEMP 'release\adaptive-master-subagent-orchestration-3.08.zip'
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'e45eed1762ed24d1a0f671d9fb7424558694f0bef557aaca97f0cc0828d07be6'){throw "Bad release hash $sha"}
          $server=Start-Process (Get-Command python).Source -ArgumentList @('-m','http.server','8767','--bind','127.0.0.1','--directory',(Split-Path $zip)) -PassThru -WindowStyle Hidden
          try{
            Start-Sleep 2
            $env:AMS_RELEASE_URL='http://127.0.0.1:8767/'+[IO.Path]::GetFileName($zip)
            $env:AMS_EXPECTED_SHA256=$sha
            $env:AMS_SKILL_HOME=Join-Path $env:RUNNER_TEMP 'ps-home'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if($LASTEXITCODE){throw "Install exit $LASTEXITCODE"}
            $root=Join-Path $env:AMS_SKILL_HOME 'adaptive-master-subagent-orchestration'
            if(!(Test-Path (Join-Path $root 'SKILL.md'))){throw 'Missing installed skill'}
            New-Item -ItemType Directory -Force (Join-Path $env:AMS_SKILL_HOME 'unrelated')|Out-Null
            Set-Content (Join-Path $env:AMS_SKILL_HOME 'unrelated\SKILL.md') keep
            Set-Content (Join-Path $root 'stale.txt') stale
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if($LASTEXITCODE){throw "Update exit $LASTEXITCODE"}
            if(!(Test-Path (Join-Path $env:AMS_SKILL_HOME 'unrelated\SKILL.md'))){throw 'Unrelated removed'}
            if(Test-Path (Join-Path $root 'stale.txt')){throw 'Stale file retained'}
            $env:AMS_EXPECTED_SHA256='0'*64
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
            if($LASTEXITCODE -eq 0){throw 'Bad checksum accepted'}
            if(!(Test-Path (Join-Path $root 'SKILL.md'))){throw 'Existing install damaged'}
          }finally{Stop-Process $server.Id -Force -ErrorAction SilentlyContinue}
      - name: Test PowerShell private release path
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Remove-Item Env:AMS_RELEASE_URL,Env:AMS_EXPECTED_SHA256 -ErrorAction SilentlyContinue
          $env:AMS_SKILL_HOME=Join-Path $env:RUNNER_TEMP 'ps-private'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if($LASTEXITCODE){throw "Private install exit $LASTEXITCODE"}
          if(!(Test-Path (Join-Path $env:AMS_SKILL_HOME 'adaptive-master-subagent-orchestration\SKILL.md'))){throw 'Private install missing'}
