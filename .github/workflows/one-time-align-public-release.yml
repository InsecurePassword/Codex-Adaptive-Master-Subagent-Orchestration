name: One-time align public release

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/align-final-public-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove this workflow and establish the final public commit
        shell: bash
        run: |
          rm -- .github/workflows/one-time-align-public-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-align-public-release.yml
          git commit -m "Finalize public repository cleanup"
          git push origin HEAD:main

      - name: Recreate release 3.09 at the final clean commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          final_sha="$(git rev-parse HEAD)"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/3.09" --jq '.id' 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/3.09" >/dev/null 2>&1 || true

          release_body="$(cat <<'EOF'
First public release of Adaptive Master–Subagent Orchestration 3.09.

The live installers and verified package are maintained directly on the `main` branch; this release intentionally has no uploaded assets.

PowerShell:
`powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \"irm 'https://github.com/InsecurePassword/Codex-Adaptive-Master-Subagent-Orchestration/raw/refs/heads/main/install.ps1' | iex\"`

Bash:
`curl -fsSL 'https://github.com/InsecurePassword/Codex-Adaptive-Master-Subagent-Orchestration/raw/refs/heads/main/install.sh' | bash`

Package SHA-256: `f35aa28cad7c2691e80823e36ca276cbee8b20de067600fd8edb8f2aaf10fe4b`
EOF
)"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name='3.09' \
            -f target_commitish="$final_sha" \
            -f name='Adaptive Master–Subagent Orchestration 3.09' \
            -f body="$release_body" \
            -F draft=false \
            -F prerelease=false >/dev/null

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1 || true
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[].id')

          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Release 3.09 was recreated at final clean main commit ${final_sha}, with zero uploaded assets. The temporary alignment workflow and branch were removed, and superseded Actions runs were pruned."
