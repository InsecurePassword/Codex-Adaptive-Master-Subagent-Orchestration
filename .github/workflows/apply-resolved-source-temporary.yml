name: Apply resolved source

on:
  push:
    branches:
      - agent/ams-4.0-modular-governance
    paths:
      - .ams-resolved-source.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
          fetch-depth: 0
      - name: Verify and apply exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_archive='f5904084bdbf7bbfb721627dfbb52c75397c757b55eac31dbdb09b2d9d9c476a'
          expected_parts=(
            'a9f0a0ce9ca19730bfffb97eda9166787db294b841ee2ef0dd7b95b26a1c391c'
            'a130e291258968bc42a001f55146e4f7b3da6acfed81b8cbc5d6842494911375'
            '46a567e4a7af0dc9a509adc2e3e351709adc49aa1295c8dbb0ef39f2e23b3401'
            '9c60423e4080fa48187c685590d5ba5f1868a2f22a40b73108a97ac4bcd189a0'
            'f97e282295dac5dfc28344c868a66a52b6bf4b6271604129bcb7c317ac534f19'
            'eb651f0b5fe5987e27e185529ed8112661104753dbcc4d222408759508212d0a'
            '087c27610606a7c8f9c5e359024eaabf555a34c787dbaed54927458b01073b69'
            '9edf67667261768c40afc84dbef7c06e8d7023acf2afca2c76d4d6d2fa6a9575'
            '814f062f4b739ee6cda3ba1f171f070263c7fd198f3244eb5f8f2c6280281ea4'
            'f97f4d070ace37bfd8e26ca2f1e05edf9d3cc86ee160ea229142f7429ecb0962'
          )
          : > "$RUNNER_TEMP/source.b64"
          for i in $(seq -w 0 9); do
            part=".ams-resolved-source.part${i}"
            test -f "$part"
            index=$((10#$i))
            test "$(sha256sum "$part" | awk '{print $1}')" = "${expected_parts[$index]}"
            cat "$part" >> "$RUNNER_TEMP/source.b64"
          done
          base64 --decode "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/source.tar.gz" | awk '{print $1}')" = "$expected_archive"
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/install-manifest.txt"
          test -f "$RUNNER_TEMP/source/.github/workflows/verify.yml"
          test ! -e "$RUNNER_TEMP/source/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/source/." .
          python3 -m py_compile verification/verify_repository.py verification/verify_contract_scenarios.py verification/verify_installers.py verification/verify_runtime_observation.py tools/measure_context.py tools/report_sizes.py extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
          python3 verification/verify_repository.py
          python3 verification/verify_contract_scenarios.py
          python3 verification/verify_runtime_observation.py
          python3 verification/verify_installers.py
          python3 tools/measure_context.py --json > /dev/null
          python3 tools/report_sizes.py --check
          bash -n install.sh
          git config user.name 'AMS release automation'
          git config user.email 'noreply@github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply final audited AMS 4.0 source'
          git push origin HEAD:agent/ams-4.0-modular-governance
