name: Apply resolved source

on:
  push:
    branches:
      - agent/ams-4.0-modular-governance
    paths:
      - .ams-resolved-source.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
          fetch-depth: 0
      - name: Verify and apply exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='f5904084bdbf7bbfb721627dfbb52c75397c757b55eac31dbdb09b2d9d9c476a'
          cp .ams-resolved-source.tar.gz "$RUNNER_TEMP/source.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/source.tar.gz" | awk '{print $1}')" = "$expected"
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/install-manifest.txt"
          test -f "$RUNNER_TEMP/source/.github/workflows/verify.yml"
          test ! -e "$RUNNER_TEMP/source/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/source/." .
          python3 -m py_compile verification/verify_repository.py verification/verify_contract_scenarios.py verification/verify_installers.py verification/verify_runtime_observation.py tools/measure_context.py tools/report_sizes.py extensions/ams-runtime-observation/tools/inspect-agent-runtime.py
          python3 verification/verify_repository.py
          python3 verification/verify_contract_scenarios.py
          python3 verification/verify_runtime_observation.py
          python3 verification/verify_installers.py
          python3 tools/measure_context.py --json > /dev/null
          python3 tools/report_sizes.py --check
          bash -n install.sh
          git config user.name 'AMS release automation'
          git config user.email 'noreply@github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply final audited AMS 4.0 source'
          git push origin HEAD:agent/ams-4.0-modular-governance
