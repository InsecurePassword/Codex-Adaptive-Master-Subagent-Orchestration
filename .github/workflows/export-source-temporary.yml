name: Temporary source export

on:
  push:
    branches:
      - agent/ams-4.0-modular-governance
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package exact checkout
        shell: bash
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/ams-pr44-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ams-pr44-source
          path: ${{ runner.temp }}/ams-pr44-source.tar.gz
          if-no-files-found: error
          retention-days: 1
