name: Temporary final source applicator

on:
  push:
    branches:
      - agent/ams-4.0-modular-governance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
      - name: Apply audited source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(.ams-final-source.part*)
          shopt -u nullglob
          if (( ${#parts[@]} == 0 )); then
            echo "No final source payload is present."
            exit 0
          fi
          encoded="$RUNNER_TEMP/ams-final-source.b64"
          archive="$RUNNER_TEMP/ams-final-source.tar.gz"
          extracted="$RUNNER_TEMP/ams-final-source"
          cat "${parts[@]}" > "$encoded"
          base64 --decode "$encoded" > "$archive"
          printf '%s  %s\n' 'b11aa095433f7ddc1fd7d114e4883b1702187cb5c6de5a6fc5ad7f46d2368500' "$archive" | sha256sum -c -
          mkdir "$extracted"
          tar -xzf "$archive" -C "$extracted"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$extracted"/. .
          git config user.name 'AMS release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize AMS 4.0 modular governance release candidate'
          git push origin HEAD:agent/ams-4.0-modular-governance
