name: Temporary tree identity

on:
  push:
    branches:
      - agent/ams-4.0-modular-governance
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ams-4.0-modular-governance
          path: head
      - uses: actions/checkout@v7
        with:
          ref: e43069dfb1e44a614e10d40c3aa06ce631cb772b
          path: base
      - name: Record exact tree identities
        shell: bash
        run: |
          {
            printf 'head_commit=%s\n' "$(git -C head rev-parse HEAD)"
            printf 'head_tree=%s\n' "$(git -C head rev-parse HEAD^{tree})"
            printf 'base_commit=%s\n' "$(git -C base rev-parse HEAD)"
            printf 'base_tree=%s\n' "$(git -C base rev-parse HEAD^{tree})"
          } > "$RUNNER_TEMP/trees.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ams-pr44-tree-identities
          path: ${{ runner.temp }}/trees.txt
          if-no-files-found: error
          retention-days: 1
