name: Temporary AMS checksum synchronization

on:
  push:
    branches:
      - "agent/fix-ams-v2-profile-instruction-chain"

permissions:
  contents: write

jobs:
  update-checksum:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace the superseded package checksum
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "3e3e8dc3142d5bc2411a4703982150941816c3669d5f0bb01bab2099f7a88373"
          new = "74e48106fc26a6516db3e9f6cc15e66e745d4fe71e24fdee233a6cf972fe4514"
          paths = [
              Path("README.md"),
              Path("INSTALLATION.md"),
              Path("PRODUCT DOCUMENTATION.md"),
              Path("install.ps1"),
              Path("install.sh"),
          ]

          replacements = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one old checksum in {path}; found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
              replacements += count

          if replacements != len(paths):
              raise SystemExit(f"Expected {len(paths)} replacements; made {replacements}")
          PY

          if git grep -n '3e3e8dc3142d5bc2411a4703982150941816c3669d5f0bb01bab2099f7a88373' -- . ':!.github/workflows/temporary-ams-checksum-sync.yml'; then
            echo "Superseded checksum remains in tracked repository content." >&2
            exit 1
          fi

      - name: Commit synchronized checksum references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md INSTALLATION.md 'PRODUCT DOCUMENTATION.md' install.ps1 install.sh
          git commit -m "Synchronize AMS 3.09 release checksum"
          git push origin HEAD:"${GITHUB_REF_NAME}"
