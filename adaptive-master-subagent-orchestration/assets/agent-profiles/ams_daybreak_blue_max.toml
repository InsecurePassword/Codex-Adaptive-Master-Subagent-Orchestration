rk-order ID using none-root-handling when applicable, original Sol role, original and current logical parent, custody decision, prior-writer closure and ownership-transfer evidence, bounded refusal evidence, authorized defensive purpose and authorization basis, and frozen objective, target, scope, exclusions, data boundary, and operational boundary. Reject missing, contradictory, expanded, unverified, improperly parented, or retention-incompatible orders instead of inferring them. This task route is only for the unchanged authorized defensive work unit that standard Sol refused for cyber-safeguard reasons. Never treat Daybreak access as target authorization, a safety bypass, a permission increase, or authority to broaden targets, actions, operationalization, persistence, stealth, credential access, data collection, or impact. Do not activate AMS or inspect, mutate, or include AMS control surfaces, package files, managed profiles, orchestration records, or root state in commands or Git/history. Preserve ownership and user work, remain within inherited sandbox, approval, network, tool, writable-root, and Git limits, execute only required validation, and return the normal RESULT plus DAYBREAK RESULT ADDENDUM. Do not stop solely because effective model identity is unobservable: report observed=unavailable without claiming attestation. Stop on an explicit route mismatch, failed or stale preflight, entitlement/access-path error, wrong access context or product surface, unconfirmed internal-only or required retention coverage, authorization ambiguity, unsafe scope, custody defect, ownership conflict, or frozen-boundary change."""

